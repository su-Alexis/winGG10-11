name: Release

# Push a tag such as v2026.10.23 to publish the script with its SHA256.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # .gitattributes checks *.ps1 out with CRLF on every OS, so this is the same file a
      # Windows clone gets. The release asset is the file the hash is for.
      - name: Publish the script and its SHA256
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          file='winGG10&11.ps1'
          hash=$(sha256sum -- "$file" | cut -d' ' -f1)
          printf '%s  %s\n' "$hash" "$file" > SHA256SUMS.txt
          printf 'SHA256 of %s:\n\n    %s\n\nCheck it with:\n\n    Get-FileHash -Algorithm SHA256 %s\n' \
              "$file" "$hash" "'.\\$file'" > notes.md
          gh release create "$TAG" "$file" SHA256SUMS.txt --title "$TAG" --notes-file notes.md
